name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK platform
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;35.0.0" || true

      # The keystore and its passwords only ever live in repository secrets.
      - name: Materialise signing material
        env:
          KEYSTORE_B64: ${{ secrets.IMMORAL_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.IMMORAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IMMORAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IMMORAL_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore/signing.properties

      - name: Build
        env:
          IMMORAL_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          IMMORAL_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$IMMORAL_VERSION_NAME" ]; then
            export IMMORAL_VERSION_NAME="${IMMORAL_VERSION_NAME#v}"
            echo "IMMORAL_VERSION_NAME=$IMMORAL_VERSION_NAME" >> "$GITHUB_ENV"
          fi
          ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ImmoralLocation-${IMMORAL_VERSION_NAME:-dev}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ImmoralLocation
          body: ImmoralLocation
          files: dist/*.apk
          fail_on_unmatched_files: true

